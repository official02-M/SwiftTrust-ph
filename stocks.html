<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PSE Stocks — SwiftTrust PH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
  .stock-tabs { display: flex; gap: 6px; padding: 0 18px; margin-bottom: 14px; }
  .stock-tab { flex: 1; padding: 10px 8px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: .82rem; font-weight: 600; color: var(--text-dim); cursor: pointer; font-family: inherit; transition: .15s; }
  .stock-tab.active { background: var(--gold); color: #fff; border-color: var(--gold); }
  .stock-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); cursor: pointer; text-decoration: none; color: inherit; transition: background .12s; }
  .stock-row:hover { background: #fafcfe; text-decoration: none; }
  .stock-row:last-child { border-bottom: none; }
  .stock-logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--navy), var(--gold)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .78rem; flex-shrink: 0; }
  .stock-name { font-weight: 700; font-size: .9rem; color: var(--ink); }
  .stock-ticker { font-size: .72rem; color: var(--text-faint); margin-top: 1px; }
  .stock-price { margin-left: auto; text-align: right; }
  .stock-price-val { font-weight: 700; font-size: .9rem; color: var(--ink); font-family: ui-monospace, monospace; }
  .stock-price-chg { font-size: .72rem; font-weight: 600; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .watch-star { background: none; border: none; color: var(--line-2); font-size: 1rem; padding: 4px; }
  .watch-star.on { color: var(--gold); }
</style>
</head>
<body>

<div class="mob-shell">
  <header class="mob-header">
    <div class="mob-header-inner">
      <div class="mob-header-left">
        <button class="mob-menu-btn" id="menuBtn"><i class="fas fa-bars"></i></button>
        <h1 style="font-size:1.05rem;">PSE Stocks</h1>
      </div>
    </div>
  </header>

  <div class="stock-tabs">
    <button class="stock-tab active" data-tab="market">Market</button>
    <button class="stock-tab" data-tab="portfolio">Portfolio</button>
    <button class="stock-tab" data-tab="watchlist">Watchlist</button>
  </div>

  <div class="mob-pad">
    <div class="card" style="padding:0;overflow:hidden;margin-bottom:24px;">
      <div id="stockList">
        <div class="empty-state"><i class="fas fa-circle-notch fa-spin"></i><p>Loading…</p></div>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="bottom-nav-item"><i class="fas fa-house"></i><span>Home</span></a>
  <a href="history.html" class="bottom-nav-item"><i class="fas fa-clock-rotate-left"></i><span>History</span></a>
  <a href="#" id="bottomNavMenu" class="bottom-nav-item"><i class="fas fa-bars"></i><span>Menu</span></a>
  <a href="stocks.html" class="bottom-nav-item active"><i class="fas fa-chart-line"></i><span>Stocks</span></a>
  <a href="profile.html" class="bottom-nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="drawer.js"></script>

<script>
const STOCKS = [
  { symbol: 'SM',    name: 'SM Investments',              price: 830.00 },
  { symbol: 'BDO',   name: 'BDO Unibank',                 price: 148.00 },
  { symbol: 'JFC',   name: 'Jollibee Foods',              price: 228.00 },
  { symbol: 'AEV',   name: 'Aboitiz Equity Ventures',     price: 32.50 },
  { symbol: 'TEL',   name: 'PLDT',                        price: 1220.00 },
  { symbol: 'ALI',   name: 'Ayala Land',                  price: 27.40 },
  { symbol: 'URC',   name: 'Universal Robina',            price: 76.20 },
  { symbol: 'AC',    name: 'Ayala Corporation',           price: 555.00 },
  { symbol: 'SMPH',  name: 'SM Prime Holdings',           price: 28.50 },
  { symbol: 'GLO',   name: 'Globe Telecom',               price: 2180.00 },
  { symbol: 'MBT',   name: 'Metropolitan Bank',           price: 68.90 },
  { symbol: 'BPI',   name: 'Bank of the Philippine Islands', price: 118.50 },
  { symbol: 'ICT',   name: 'Intl Container Terminal',     price: 340.00 },
  { symbol: 'MER',   name: 'Meralco',                     price: 435.00 },
  { symbol: 'AGI',   name: 'Alliance Global',             price: 9.50 },
  { symbol: 'SECB',  name: 'Security Bank',               price: 78.50 },
  { symbol: 'PGOLD', name: 'Puregold Price Club',         price: 27.00 },
  { symbol: 'ACEN',  name: 'ACEN Corporation',            price: 4.20 },
  { symbol: 'MONDE', name: 'Monde Nissin',                price: 9.80 },
  { symbol: 'CNVRG', name: 'Converge ICT',                price: 16.50 }
];

let livePrices = {};
STOCKS.forEach(s => {
  livePrices[s.symbol] = { price: s.price, change: 0 };
});

setInterval(() => {
  STOCKS.forEach(s => {
    const cur = livePrices[s.symbol].price;
    const delta = cur * (Math.random() * 0.003 - 0.0015);
    const next = Math.max(0.01, cur + delta);
    livePrices[s.symbol].price = next;
    livePrices[s.symbol].change = ((next - s.price) / s.price) * 100;
  });
  if (activeTab) renderList();
}, 4000);

let currentUid = null, userProfile = null;
let activeTab = 'market';
let holdings = [], watchlist = [];
let unsubHoldings;

auth.onAuthStateChanged(async (user) => {
  if (!user) { window.location.href = 'login.html'; return; }
  const snap = await db.collection('swifttrust_users').doc(user.uid).get();
  if (!snap.exists) { await auth.signOut(); window.location.href = 'login.html'; return; }
  const data = snap.data();
  if (data.status !== 'approved') { await auth.signOut(); window.location.href = 'login.html'; return; }
  currentUid = user.uid;
  userProfile = data;
  watchlist = data.watchlist || [];

  if (unsubHoldings) unsubHoldings();
  unsubHoldings = db.collection('swifttrust_holdings')
    .where('ownerId', '==', currentUid)
    .onSnapshot(snap => {
      holdings = [];
      snap.forEach(d => holdings.push({ id: d.id, ...d.data() }));
      if (activeTab === 'portfolio') renderList();
    });
  renderList();
});

document.querySelectorAll('.stock-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.stock-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    renderList();
  });
});

function renderList() {
  const el = document.getElementById('stockList');
  if (!el) return;
  if (activeTab === 'market') return renderMarket(el);
  if (activeTab === 'watchlist') return renderWatchlist(el);
  if (activeTab === 'portfolio') return renderPortfolio(el);
}

function rowHTML(s) {
  const p = livePrices[s.symbol];
  const chg = p.change || 0;
  const cls = chg >= 0 ? 'up' : 'down';
  const sign = chg >= 0 ? '+' : '';
  const starred = watchlist.includes(s.symbol);
  return `
    <div class="stock-row" data-symbol="${s.symbol}">
      <div class="stock-logo">${s.symbol.slice(0, 3)}</div>
      <div>
        <div class="stock-name">${s.name}</div>
        <div class="stock-ticker">${s.symbol} · PSE</div>
      </div>
      <div class="stock-price">
        <div class="stock-price-val">${stbMoney(p.price)}</div>
        <div class="stock-price-chg ${cls}">${sign}${chg.toFixed(2)}%</div>
      </div>
      <button class="watch-star ${starred ? 'on' : ''}" data-star="${s.symbol}">
        <i class="fa${starred ? 's' : 'r'} fa-star"></i>
      </button>
    </div>
  `;
}

function renderMarket(el) {
  el.innerHTML = STOCKS.map(s => rowHTML(s)).join('');
  wireRows(el);
}

function renderWatchlist(el) {
  const list = STOCKS.filter(s => watchlist.includes(s.symbol));
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state"><i class="fas fa-star"></i><p>No stocks in your watchlist yet. Tap a star to add one.</p></div>`;
    return;
  }
  el.innerHTML = list.map(s => rowHTML(s)).join('');
  wireRows(el);
}

function renderPortfolio(el) {
  if (holdings.length === 0) {
    el.innerHTML = `<div class="empty-state"><i class="fas fa-briefcase"></i><p>You don't own any PSE stocks yet. Buy your first from the Market tab.</p></div>`;
    return;
  }
  let total = 0, cost = 0;
  const rows = holdings.map(h => {
    const live = livePrices[h.symbol] ? livePrices[h.symbol].price : h.avgPrice;
    const value = live * h.shares;
    const spent = h.avgPrice * h.shares;
    total += value; cost += spent;
    return { h, value, spent };
  });
  const gain = total - cost;
  const gainPct = cost > 0 ? (gain / cost) * 100 : 0;

  el.innerHTML = `
    <div style="padding:20px;background:linear-gradient(135deg,var(--navy),var(--gold));color:#fff;">
      <div style="font-size:.72rem;color:#fef0c7;text-transform:uppercase;letter-spacing:.08em;font-weight:600;">Portfolio Value</div>
      <div style="font-size:1.9rem;font-weight:700;margin-top:6px;letter-spacing:-.02em;">${stbMoney(total)}</div>
      <div style="font-size:.85rem;margin-top:6px;color:${gain >= 0 ? '#86efac' : '#fca5a5'};">
        ${gain >= 0 ? '+' : ''}${stbMoney(gain)} (${gain >= 0 ? '+' : ''}${gainPct.toFixed(2)}%)
      </div>
    </div>
    ${rows.map(({ h, value, spent }) => {
      const pct = spent > 0 ? ((value - spent) / spent) * 100 : 0;
      const cls = pct >= 0 ? 'up' : 'down';
      const sign = pct >= 0 ? '+' : '';
      return `
        <div class="stock-row" data-symbol="${h.symbol}">
          <div class="stock-logo">${h.symbol.slice(0, 3)}</div>
          <div>
            <div class="stock-name">${h.symbol}</div>
            <div class="stock-ticker">${h.shares} share${h.shares === 1 ? '' : 's'} · avg ${stbMoney(h.avgPrice)}</div>
          </div>
          <div class="stock-price">
            <div class="stock-price-val">${stbMoney(value)}</div>
            <div class="stock-price-chg ${cls}">${sign}${pct.toFixed(2)}%</div>
          </div>
        </div>`;
    }).join('')}
  `;
  wireRows(el);
}

function wireRows(el) {
  el.querySelectorAll('.stock-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if (e.target.closest('.watch-star')) return;
      window.location.href = 'stock-detail.html?symbol=' + row.dataset.symbol;
    });
  });
  el.querySelectorAll('.watch-star').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const sym = btn.dataset.star;
      const idx = watchlist.indexOf(sym);
      if (idx === -1) watchlist.push(sym); else watchlist.splice(idx, 1);
      btn.classList.toggle('on');
      btn.querySelector('i').className = watchlist.includes(sym) ? 'fas fa-star' : 'far fa-star';
      try { await db.collection('swifttrust_users').doc(currentUid).update({ watchlist }); }
      catch (err) { console.error(err); }
      if (activeTab === 'watchlist') renderList();
    });
  });
}
</script>
</body>
</html>
